<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <title>NutriVida|Login</title>
</head>
<body>
    <main>
        <!--se crea el login-->
        <section class="login">
            <!--se hace un div para que se vea como una carta-->
            <div class="contenedor-login">
                <h1>Iniciar Sesión</h1>

                <!--se crean los input de correo y contraseña con sus placeholder respectivoss-->
                <label for="email">Correo Electronico</label>
                <input type="email" name="email" id="email" placeholder="nutrivida@nutri.com" required>
                
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="********" required>

                <!--se hace un link donde se podrá recuperar la contraseña-->
                <a href="#">¿Olvidaste tu contraseña?</a>

                <!--boton para iniciar sesión-->
                <button type="submit">Iniciar sesión</button>

                <!--link que redirige a la pagina de registro-->
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>

            </div>
        </section>
    </main>
</body>
</html>
