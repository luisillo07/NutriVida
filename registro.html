<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/registro.css">
    <title>NutriVida|Registro</title>
</head>
<body>
    <main>
        <!--se crea el registro-->
        <section class="registro">

            <!--se hace un div para que se vea como una carta-->
            <div class="contenedor-registro">

                <h1>Crear Cuenta</h1>

                <!--se crean los input para ingresar los datos del usuario-->
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Carlos" required>

                <label for="apellido">Apellido</label>
                <input type="text" name="apellido" id="apellido" placeholder="Pinto" required>

                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="email" placeholder="nutrivida@nutri.com" required>

                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="********" required>

                <label for="confirmar-password">Confirmar Contraseña</label>
                <input type="password" name="confirmar-password" id="confirmar-password" placeholder="********" required>

                <!--boton para crear la cuenta-->
                <button type="submit">Registrarse</button>

                <!--link que redirige a la pagina de inicio de sesion-->
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia Sesión</a></p>

            </div>

        </section>
    </main>
</body>
</html>
