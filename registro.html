<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/registro.css">
    <script src="/js/registro.js" defer></script>
    <title>NutriVida|Registro</title>
</head>
<body>
    <main>
        <!--se crea el registro-->
        <section class="registro">

            <form class="contenedor-registro" id="form-registro">

                <h1>Crear Cuenta</h1>

                <!--se crean los input para ingresar los datos del usuario-->
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Carlos" required>

                <label for="apellido">Apellido</label>
                <input type="text" name="apellido" id="apellido" placeholder="Pinto" required>

                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="email" placeholder="nutrivida@nutri.com" required>

                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="********" required>

                <label for="confirmar-password">Confirmar Contraseña</label>
                <input type="password" name="confirmar-password" id="confirmar-password" placeholder="********" required>
            
                <!--mensaje donde se mostraran los errores-->
                <p id="mensaje-error"></p>

                <button type="submit">Registrarse</button>

                <p>¿Ya tienes una cuenta?<a href="login.html"> Inicia Sesión</a></p>

            </form>
        </section>
    </main>
</body>
</html>
